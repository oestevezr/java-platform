{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Transform": "AWS::Serverless-2016-10-31",
  "Description": "NETEC learning scaffold. Review costs and account configuration before deploying.",
  "Parameters": {
    "AuthDomainPrefix": {
      "Type": "String",
      "Default": "netec-ruta",
      "AllowedPattern": "[a-z0-9-]+",
      "MaxLength": 40
    },
    "LogRetentionDays": {
      "Type": "Number",
      "Default": 7,
      "AllowedValues": [
        1,
        3,
        7,
        14,
        30
      ]
    },
    "AllowSelfRegistration": {
      "Type": "String",
      "Default": "false",
      "AllowedValues": [
        "true",
        "false"
      ]
    }
  },
  "Conditions": {
    "InvitationsOnly": {
      "Fn::Equals": [
        {
          "Ref": "AllowSelfRegistration"
        },
        "false"
      ]
    }
  },
  "Resources": {
    "FrontendBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        }
      }
    },
    "ContentBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        },
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        }
      }
    },
    "OriginAccessControl": {
      "Type": "AWS::CloudFront::OriginAccessControl",
      "Properties": {
        "OriginAccessControlConfig": {
          "Name": {
            "Fn::Sub": "${AWS::StackName}-website"
          },
          "OriginAccessControlOriginType": "s3",
          "SigningBehavior": "always",
          "SigningProtocol": "sigv4"
        }
      }
    },
    "CachePolicy": {
      "Type": "AWS::CloudFront::CachePolicy",
      "Properties": {
        "CachePolicyConfig": {
          "Name": {
            "Fn::Sub": "${AWS::StackName}-assets"
          },
          "MinTTL": 0,
          "DefaultTTL": 86400,
          "MaxTTL": 31536000,
          "ParametersInCacheKeyAndForwardedToOrigin": {
            "EnableAcceptEncodingGzip": true,
            "EnableAcceptEncodingBrotli": true,
            "CookiesConfig": {
              "CookieBehavior": "none"
            },
            "HeadersConfig": {
              "HeaderBehavior": "none"
            },
            "QueryStringsConfig": {
              "QueryStringBehavior": "none"
            }
          }
        }
      }
    },
    "SecurityHeaders": {
      "Type": "AWS::CloudFront::ResponseHeadersPolicy",
      "Properties": {
        "ResponseHeadersPolicyConfig": {
          "Name": {
            "Fn::Sub": "${AWS::StackName}-headers"
          },
          "SecurityHeadersConfig": {
            "ContentTypeOptions": {
              "Override": true
            },
            "FrameOptions": {
              "FrameOption": "DENY",
              "Override": true
            },
            "ReferrerPolicy": {
              "ReferrerPolicy": "strict-origin-when-cross-origin",
              "Override": true
            },
            "StrictTransportSecurity": {
              "AccessControlMaxAgeSec": 31536000,
              "Override": true
            },
            "ContentSecurityPolicy": {
              "ContentSecurityPolicy": "default-src 'self'; script-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.amazonaws.com https://*.amazoncognito.com; img-src 'self' data:; frame-src https://*.amazoncognito.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'",
              "Override": true
            }
          }
        }
      }
    },
    "Distribution": {
      "Type": "AWS::CloudFront::Distribution",
      "Properties": {
        "DistributionConfig": {
          "Enabled": true,
          "DefaultRootObject": "index.html",
          "HttpVersion": "http2",
          "PriceClass": "PriceClass_100",
          "Origins": [
            {
              "Id": "WebsiteOrigin",
              "DomainName": {
                "Fn::GetAtt": [
                  "FrontendBucket",
                  "RegionalDomainName"
                ]
              },
              "OriginAccessControlId": {
                "Ref": "OriginAccessControl"
              },
              "S3OriginConfig": {
                "OriginAccessIdentity": ""
              }
            }
          ],
          "DefaultCacheBehavior": {
            "TargetOriginId": "WebsiteOrigin",
            "ViewerProtocolPolicy": "redirect-to-https",
            "AllowedMethods": [
              "GET",
              "HEAD"
            ],
            "Compress": true,
            "CachePolicyId": {
              "Ref": "CachePolicy"
            },
            "ResponseHeadersPolicyId": {
              "Ref": "SecurityHeaders"
            }
          },
          "ViewerCertificate": {
            "CloudFrontDefaultCertificate": true
          }
        }
      }
    },
    "FrontendBucketPolicy": {
      "Type": "AWS::S3::BucketPolicy",
      "Properties": {
        "Bucket": {
          "Ref": "FrontendBucket"
        },
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "cloudfront.amazonaws.com"
              },
              "Action": "s3:GetObject",
              "Resource": {
                "Fn::Sub": "${FrontendBucket.Arn}/*"
              },
              "Condition": {
                "StringEquals": {
                  "AWS:SourceArn": {
                    "Fn::Sub": "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
                  }
                }
              }
            }
          ]
        }
      }
    },
    "UserPool": {
      "Type": "AWS::Cognito::UserPool",
      "Properties": {
        "UserPoolName": {
          "Fn::Sub": "${AWS::StackName}-candidates"
        },
        "UsernameAttributes": [
          "email"
        ],
        "AutoVerifiedAttributes": [
          "email"
        ],
        "AdminCreateUserConfig": {
          "AllowAdminCreateUserOnly": {
            "Fn::If": [
              "InvitationsOnly",
              true,
              false
            ]
          }
        },
        "Policies": {
          "PasswordPolicy": {
            "MinimumLength": 12,
            "RequireLowercase": true,
            "RequireNumbers": true,
            "RequireSymbols": true,
            "RequireUppercase": true
          }
        },
        "Schema": [
          {
            "Name": "email",
            "Required": true,
            "Mutable": true
          }
        ]
      }
    },
    "ResourceServer": {
      "Type": "AWS::Cognito::UserPoolResourceServer",
      "Properties": {
        "UserPoolId": {
          "Ref": "UserPool"
        },
        "Identifier": "learning",
        "Name": "Learning API",
        "Scopes": [
          {
            "ScopeName": "read",
            "ScopeDescription": "Read own learning data"
          },
          {
            "ScopeName": "write",
            "ScopeDescription": "Update own learning plan"
          }
        ]
      }
    },
    "UserPoolClient": {
      "Type": "AWS::Cognito::UserPoolClient",
      "DependsOn": [
        "ResourceServer"
      ],
      "Properties": {
        "UserPoolId": {
          "Ref": "UserPool"
        },
        "GenerateSecret": false,
        "AllowedOAuthFlowsUserPoolClient": true,
        "AllowedOAuthFlows": [
          "code"
        ],
        "AllowedOAuthScopes": [
          "openid",
          "email",
          "profile",
          "learning/read",
          "learning/write"
        ],
        "SupportedIdentityProviders": [
          "COGNITO"
        ],
        "CallbackURLs": [
          {
            "Fn::Sub": "https://${Distribution.DomainName}/"
          }
        ],
        "LogoutURLs": [
          {
            "Fn::Sub": "https://${Distribution.DomainName}/"
          }
        ],
        "PreventUserExistenceErrors": "ENABLED",
        "EnableTokenRevocation": true,
        "AccessTokenValidity": 15,
        "IdTokenValidity": 15,
        "RefreshTokenValidity": 1,
        "TokenValidityUnits": {
          "AccessToken": "minutes",
          "IdToken": "minutes",
          "RefreshToken": "days"
        }
      }
    },
    "AuthDomain": {
      "Type": "AWS::Cognito::UserPoolDomain",
      "Properties": {
        "UserPoolId": {
          "Ref": "UserPool"
        },
        "Domain": {
          "Fn::Sub": "${AuthDomainPrefix}-${AWS::AccountId}"
        }
      }
    },
    "AdministratorGroup": {
      "Type": "AWS::Cognito::UserPoolGroup",
      "Properties": {
        "UserPoolId": {
          "Ref": "UserPool"
        },
        "GroupName": "administrator",
        "Description": "Operator-assigned read-only candidate oversight"
      }
    },
    "ProgressTable": {
      "Type": "AWS::DynamoDB::Table",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "OnDemandThroughput": {
          "MaxReadRequestUnits": 10,
          "MaxWriteRequestUnits": 10
        },
        "AttributeDefinitions": [
          {
            "AttributeName": "PK",
            "AttributeType": "S"
          },
          {
            "AttributeName": "SK",
            "AttributeType": "S"
          },
          {
            "AttributeName": "GSI1PK",
            "AttributeType": "S"
          },
          {
            "AttributeName": "GSI1SK",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "PK",
            "KeyType": "HASH"
          },
          {
            "AttributeName": "SK",
            "KeyType": "RANGE"
          }
        ],
        "GlobalSecondaryIndexes": [
          {
            "IndexName": "CandidateDirectory",
            "KeySchema": [
              {
                "AttributeName": "GSI1PK",
                "KeyType": "HASH"
              },
              {
                "AttributeName": "GSI1SK",
                "KeyType": "RANGE"
              }
            ],
            "Projection": {
              "ProjectionType": "ALL"
            },
            "OnDemandThroughput": {
              "MaxReadRequestUnits": 10,
              "MaxWriteRequestUnits": 10
            }
          }
        ]
      }
    },
    "LearningApi": {
      "Type": "AWS::Serverless::HttpApi",
      "Properties": {
        "StageName": "$default",
        "CorsConfiguration": {
          "AllowOrigins": [
            {
              "Fn::Sub": "https://${Distribution.DomainName}"
            }
          ],
          "AllowHeaders": [
            "authorization",
            "content-type"
          ],
          "AllowMethods": [
            "GET",
            "PUT",
            "OPTIONS"
          ]
        },
        "DefaultRouteSettings": {
          "ThrottlingBurstLimit": 10,
          "ThrottlingRateLimit": 5
        },
        "Auth": {
          "DefaultAuthorizer": "CognitoJwt",
          "Authorizers": {
            "CognitoJwt": {
              "IdentitySource": "$request.header.Authorization",
              "JwtConfiguration": {
                "issuer": {
                  "Fn::Sub": "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
                },
                "audience": [
                  {
                    "Ref": "UserPoolClient"
                  }
                ]
              }
            }
          }
        }
      }
    },
    "ApiFunction": {
      "Type": "AWS::Serverless::Function",
      "Properties": {
        "CodeUri": "../apps/api/dist/",
        "Handler": "handler.handler",
        "Runtime": "nodejs22.x",
        "Architectures": [
          "arm64"
        ],
        "MemorySize": 256,
        "Timeout": 10,
        "ReservedConcurrentExecutions": 2,
        "Environment": {
          "Variables": {
            "PROGRESS_TABLE": {
              "Ref": "ProgressTable"
            }
          }
        },
        "Policies": [
          {
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "dynamodb:BatchGetItem",
                  "dynamodb:PutItem",
                  "dynamodb:Query"
                ],
                "Resource": [
                  {
                    "Fn::GetAtt": [
                      "ProgressTable",
                      "Arn"
                    ]
                  },
                  {
                    "Fn::Sub": "${ProgressTable.Arn}/index/CandidateDirectory"
                  }
                ]
              }
            ]
          }
        ],
        "Events": {
          "Progress": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "LearningApi"
              },
              "Path": "/me/progress",
              "Method": "GET",
              "Auth": {
                "AuthorizationScopes": [
                  "learning/read"
                ]
              }
            }
          },
          "PlanRead": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "LearningApi"
              },
              "Path": "/me/plan",
              "Method": "GET",
              "Auth": {
                "AuthorizationScopes": [
                  "learning/read"
                ]
              }
            }
          },
          "PlanWrite": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "LearningApi"
              },
              "Path": "/me/plan",
              "Method": "PUT",
              "Auth": {
                "AuthorizationScopes": [
                  "learning/write"
                ]
              }
            }
          },
          "Candidates": {
            "Type": "HttpApi",
            "Properties": {
              "ApiId": {
                "Ref": "LearningApi"
              },
              "Path": "/admin/candidates",
              "Method": "GET",
              "Auth": {
                "AuthorizationScopes": [
                  "learning/read"
                ]
              }
            }
          }
        }
      }
    },
    "ApiLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": {
          "Fn::Sub": "/aws/lambda/${ApiFunction}"
        },
        "RetentionInDays": {
          "Ref": "LogRetentionDays"
        }
      }
    }
  },
  "Outputs": {
    "WebsiteUrl": {
      "Value": {
        "Fn::Sub": "https://${Distribution.DomainName}"
      }
    },
    "FrontendBucketName": {
      "Value": {
        "Ref": "FrontendBucket"
      }
    },
    "ApiUrl": {
      "Value": {
        "Fn::Sub": "https://${LearningApi}.execute-api.${AWS::Region}.amazonaws.com"
      }
    },
    "CognitoAuthority": {
      "Value": {
        "Fn::Sub": "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
      }
    },
    "CognitoClientId": {
      "Value": {
        "Ref": "UserPoolClient"
      }
    },
    "CognitoDomain": {
      "Value": {
        "Fn::Sub": "https://${AuthDomainPrefix}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
      }
    }
  }
}
